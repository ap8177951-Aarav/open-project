<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website</title>

    <!-- ✅ FIX 1: <style> MUST be inside <head> -->
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #0d6efd;
            padding: 20px 50px;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background: linear-gradient(to right, #0d6efd, #4dabf7);
            color: white;
            padding: 80px 50px;
            text-align: center;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .hero button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: white;
            color: #0d6efd;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #e9ecef;
        }

        .section {
            padding: 60px 50px;
            text-align: center;
        }

        .section h3 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 280px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card h4 {
            margin-top: 0;
            color: #0d6efd;
        }

        footer {
            background-color: #212529;
            color: #adb5bd;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        footer a {
            color: #adb5bd;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- ✅ FIX 2: HEADER + NAV added so CSS is applied -->
    <header>
        <h1>MyWebsite</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- ✅ FIX 3: HERO section uses .hero class -->
    <section class="hero">
        <h2>Welcome to My Website</h2>
        <p>This is a fully working front page using only HTML and CSS.</p>
        <button>Get Started</button>
    </section>

    <!-- ✅ FIX 4: FEATURES section using .section, .cards, .card -->
    <section class="section">
        <h3>Our Features</h3>

        <div class="cards">
            <div class="card">
                <h4>Fast</h4>
                <p>Optimized performance.</p>
            </div>

            <div class="card">
                <h4>Responsive</h4>
                <p>Works on all devices.</p>
            </div>

            <div class="card">
                <h4>Simple</h4>
                <p>Easy to understand code.</p>
            </div>
        </div>
    </section>

    <!-- ✅ FIX 5: FOOTER added -->
    <footer>
        <p>© 2025 MyWebsite</p>
        <a href="#">Privacy Policy</a>
    </footer>

</body>
</html>
